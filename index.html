<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bus">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<title>Bus</title>
<style>
:root{--bg:#0b0d12;--card:#12151c;--line:#232835;--key:#1a1e27;--text:#eef0f4;--muted:#8a909c;--acc:#5aa9ff;--green:#4cc38a;--amber:#f0b35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;min-height:calc(100lvh + 1px);background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
#map{position:fixed;inset:0;background:#0e1014}
.leaflet-container{background:#0e1014;font:inherit}
.leaflet-control-attribution{background:rgba(11,13,18,.7)!important;color:#5c626e!important;font-size:9px}
.leaflet-control-attribution a{color:#6f7b8e!important}
.leaflet-top{top:calc(env(safe-area-inset-top) + 74px)}
/* Верх: поиск и связь */
#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 22px);z-index:500;display:flex;gap:8px}
.glass{background:rgba(18,21,28,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px}
#qw{flex:1;min-width:0;position:relative}
#q{width:100%;height:46px;padding:0 44px 0 14px;font-size:16px;outline:none;-webkit-appearance:none}
#q::-webkit-search-cancel-button{display:none}
#qx{position:absolute;right:6px;top:7px;width:32px;height:32px;border-radius:50%;background:#2a2f3a;display:none;place-items:center;color:var(--text)}
#qx.on{display:grid}
#qx svg{width:14px;height:14px}
#q::placeholder{color:var(--muted)}
.ib{width:46px;height:46px;flex:none;display:grid;place-items:center}
.ib svg{width:21px;height:21px}
#live{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 76px);z-index:400;font-size:12px;padding:5px 10px;border-radius:20px;color:var(--muted);white-space:nowrap}
#live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
#live.on i{background:var(--green)}
#res{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 76px);z-index:600;max-height:55vh;overflow-y:auto;display:none}
#res.on{display:block}
#res .row .t{white-space:normal;line-height:1.25}
/* Справа: кнопка «где я» */
#side{position:fixed;right:12px;bottom:50vh;z-index:450;overflow:hidden}
#side button{width:46px;height:46px;display:grid;place-items:center;color:var(--acc)}
#side svg{width:21px;height:21px}
/* Нижняя панель */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;border-radius:22px 22px 0 0;border-bottom:0;display:flex;flex-direction:column;max-height:46vh;transition:max-height .25s,transform .22s,opacity .22s;padding-bottom:env(safe-area-inset-bottom)}
/* Закрытая главная панель уезжает вниз; открыть — кнопкой справа */
#sheet.off{transform:translateY(calc(100% + 40px))}
#side #panBtn{display:none;border-bottom:1px solid var(--line)}
body.off #side #panBtn{display:grid}
/* Фон панели продолжается под низ экрана: на iPhone с экрана «Домой» иначе остаётся щель */
#sheet:after{content:"";position:absolute;left:-1px;right:-1px;top:100%;height:200px;background:inherit;-webkit-backdrop-filter:inherit;backdrop-filter:inherit}
#sheet.big{max-height:82vh}
#sheet.mini{max-height:calc(26px + env(safe-area-inset-bottom))}
#grab{height:14px;flex:none;display:grid;place-items:center;width:100%;touch-action:none}
#sheet.drag{transition:none}
/* Полоска видна только у свёрнутой панели — чтобы было за что взяться */
#sheet.mini #grab{height:26px}
#sheet.mini #grab:after{content:"";width:38px;height:5px;border-radius:3px;background:#3a3f4c}
#body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;flex:1}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd .tt{flex:1;min-width:0}
.hd .t{font-size:20px;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hd .s{font-size:13px;color:var(--muted);margin-top:3px}
.rb{width:38px;height:38px;flex:none;border-radius:50%;background:var(--key);display:grid;place-items:center;color:var(--muted)}
.rb svg{width:17px;height:17px}
.rb.on{color:var(--amber)}
.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.sec:first-child{margin-top:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:11px 12px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .info{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{flex:none;min-width:42px;height:30px;padding:0 7px;border-radius:9px;background:hsl(var(--h) 60% 52%);color:#081018;font-weight:800;font-size:15px;display:inline-grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips .num{min-width:36px;height:28px;font-size:14px;border-radius:8px}
.eta{flex:none;text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.eta b{display:block;font-size:19px;color:var(--green);font-weight:700}
.eta b.sch{color:var(--text);font-weight:600;font-size:17px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-width:0;height:34px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.seg button.on{background:#262b36;color:var(--text);font-weight:600}
.tip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.tip .m{color:var(--muted)}
.tip b.g{color:var(--green)}
.stops{position:relative;padding-left:24px}
.stops:before{content:"";position:absolute;left:7px;top:18px;bottom:18px;width:3px;border-radius:2px;background:hsl(var(--h) 45% 32%)}
.sp{position:relative;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 0;font-size:15px;min-height:38px}
.sp:before{content:"";position:absolute;left:-22px;top:50%;margin-top:-6px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid hsl(var(--h) 60% 55%)}
.sp .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .w{flex:none;font-size:13px;color:var(--green);font-weight:600}
.sp.me .n{color:var(--acc);font-weight:600}
.sp.me:before{background:var(--acc);border-color:var(--acc)}
.busin{position:relative;height:0}
.busin span{position:absolute;left:-30px;top:-10px;width:20px;height:20px;border-radius:6px;background:hsl(var(--h) 60% 52%);display:grid;place-items:center;z-index:1;border:2px solid var(--bg)}
.busin svg{width:11px;height:11px;color:#081018}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:46px;border-radius:14px;background:var(--key);border:1px solid var(--line);font-weight:600;font-size:15px;display:grid;place-items:center;text-decoration:none;color:var(--text)}
.btn{display:flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:18px;height:18px}
.btn.gold{background:#e8c99c;border-color:#e8c99c;color:#14171e}
.btn.on{border-color:#e8c99c;color:#e8c99c}
/* Табло остановки: номер слева, время справа */
.brd{min-height:52px}
.brd-t{flex:none;display:flex;align-items:baseline;gap:10px}
.brd-t b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.brd-t b.g{color:var(--green)}
.brd-t span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px;line-height:1.5}
.field{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 12px;font-size:15px;outline:none}
textarea.field{height:80px;padding:10px;font-size:12px;margin-top:8px}
/* Метки на карте */
.bus{position:relative;width:40px;height:40px;color:hsl(var(--h) 62% 56%)}
/* Круг цвета маршрута с «носиком»: носик поворачивается туда, куда едет автобус */
.bus svg{position:absolute;z-index:0;inset:0;width:40px;height:40px;transition:transform .8s ease;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
/* Номер всегда ровно в центре круга и не поворачивается */
.bus b{position:absolute;z-index:1;left:8px;top:8px;width:24px;height:24px;display:grid;place-items:center;color:#081018;font-weight:800;font-size:13px;letter-spacing:-.4px;line-height:1}
.bus b.s{font-size:11px}
.bus.park{opacity:.35}
.bus.on{transform:scale(1.2)}
.busmk{transition:transform 1.4s linear}
.far .bus{transform:scale(.8)}
.far .bus.on{transform:scale(1)}
/* Стрелки вдоль линии маршрута — куда он едет */
.arw{width:14px;height:14px;display:grid;place-items:center}
.arw svg{width:11px;height:11px;color:#0b0d12}
.stp.dim{opacity:.35}
.hm{display:flex;gap:8px;align-items:flex-start}
.hm .list{flex:1;min-width:0}
.hm .rb{margin-top:11px}
#live.hide{display:none}
.row.from{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.row.from .s{margin:0 0 1px}
.chips.sm .num{min-width:30px;height:22px;font-size:12px;border-radius:6px;padding:0 5px}
.chips.sm{gap:4px;margin-top:5px}
.chev{flex:none;color:var(--muted);font-size:20px;width:20px;text-align:center}
/* Панель закрыта — кнопки справа повыше, над полоской «Домой» и подписью карты */
body.off #side{bottom:calc(env(safe-area-inset-bottom) + 64px)!important}
.zooming .busmk{transition:none}
/* Остановка вблизи: тёмная плашка с золотым автобусом, как иконка приложения */
.stp{width:22px;height:22px;border-radius:7px;background:#14171e;border:1.5px solid rgba(232,201,156,.75);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.stp svg{width:12px;height:12px;color:#e8c99c}
.stp.sel{width:30px;height:30px;border-radius:9px;background:#e8c99c;border-color:#fff}
.stp.sel svg{width:16px;height:16px;color:#14171e}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#e8c99c;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.pin:after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#14171e}
/* Поездка */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.opt.on{border-color:rgba(232,201,156,.6)}
.opt .top{display:flex;align-items:baseline;gap:8px}
.opt .top b{font-size:20px}
.opt .top span{color:var(--muted);font-size:14px}
.opt .top em{margin-left:auto;font-style:normal;font-size:13px;color:var(--green);font-weight:600}
.legs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
.legs .num{min-width:34px;height:24px;font-size:13px;border-radius:7px}
.legs svg{width:14px;height:14px;vertical-align:-2px}
.steps{margin:4px 0 0;padding:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:9px 2px;font-size:15px;line-height:1.35}
.step+.step{border-top:1px solid var(--line)}
.step .ic{flex:none;width:42px;display:grid;place-items:center;color:var(--muted)}
.step .ic svg{width:18px;height:18px}
.step .m{color:var(--muted);font-size:13px}
.step .g{color:var(--green);font-weight:600}
.me-dot{width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 6px rgba(90,169,255,.25)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 100px);transform:translateX(-50%);background:#262b36;padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;z-index:900;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <div id="qw"><input id="q" class="glass" type="search" placeholder="Куда едем?" autocomplete="off"><button id="qx" aria-label="Очистить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
  <button class="glass ib" id="setBtn" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>
<div id="live" class="glass"><i></i><span>Загрузка…</span></div>
<div id="res" class="glass"></div>
<div id="side" class="glass"><button id="panBtn" aria-label="Открыть панель"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button><button id="meBtn" aria-label="Где я"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></div>
<div id="sheet" class="glass"><button id="grab" aria-label="Развернуть"></button><div id="body"></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
const KEY = 'bus-data';
// Версия приложения — называть Андрею перед каждой публикацией
const VERSION = '2.7';
// Адрес посредника (Cloudflare Worker); можно поменять в настройках
const DEFAULT_LIVE = 'https://bus-proxy.andriiborush.workers.dev';
// Метров по прямой в минуту — средняя скорость городского автобуса с остановками
const SPEED = 230;
const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>',
  work: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg>',
  bus: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2v2h-3v-2H9v2H6v-2a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 3v5h12V6z"/></svg>',
  walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.6" fill="currentColor"/><path d="M10 21l2-6 3 3v3M9 12l2-4 4 2 2 3M11 8l-3 2-1 3"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};
let P = null; // адреса и места — грузятся при первом поиске
// Капля: круг с острым носиком вверх; поворачивается по курсу
const BUS_PIN = '<svg viewBox="0 0 40 40"><path d="M20 2.5L29 10.6A13 13 0 1 1 11 10.6Z" fill="currentColor" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
const CHEV = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8L6 4.5 9.5 8"/></svg>';
let D, map, stopLayer, stopIcons, routeLayer, busLayer, meMarker;
let S = load();
let me = S.last || null;
let buses = [], liveOk = false, fails = 0;
// По госномеру: где был, когда двигался, где был на каждом направлении
const hist = {};
const busMarkers = {};
let view = { k: 'home' }, back = [];

function load() { try { return Object.assign({ fav: [], places: [], live: DEFAULT_LIVE }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return { fav: [], places: [], live: DEFAULT_LIVE }; } }
const placeIcon = p => p.label === 'Дом' ? ICON.home : p.label === 'Работа' ? ICON.work : ICON.star;
const homeIdx = () => S.places.findIndex(p => p.label === 'Дом');
const placeIdx = to => S.places.findIndex(p => Math.abs(p.la - to.la) < 1e-5 && Math.abs(p.lo - to.lo) < 1e-5);
function placeRow(p, i) { return `<button class="row" data-pgo="${i}"><span class="rb on">${placeIcon(p)}</span><div class="info"><div class="t">${esc(p.label || p.n)}</div>${p.label ? `<div class="s">${esc(p.n)}</div>` : ''}</div></button>`; }
// Дом один: прежний снимается; если им была остановка — она уходит из адресов совсем
function clearHome() { S.places = S.places.filter(p => p.label !== 'Дом' || p.stop == null && (p.label = '', true)); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function dist(a, b, c, d) { const k = Math.PI / 180, x = (d - b) * k * Math.cos((a + c) / 2 * k), y = (c - a) * k; return Math.sqrt(x * x + y * y) * 6371000; }
const walk = m => Math.max(1, Math.round(m * 1.3 / 80));
const fmtD = m => m < 1000 ? Math.round(m / 10) * 10 + ' м' : (m / 1000).toFixed(1).replace('.', ',') + ' км';
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m) % 60).padStart(2, '0');
const mins = m => (Math.round(m) || '<1') + ' мин';
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }
const numHtml = r => `<span class="num" style="--h:${r.h}">${esc(r.ref)}</span>`;

// ---------- Данные ----------
function prepare() {
  D.byId = {};
  D.routes.forEach((r, i) => {
    D.byId[r.id] = r;
    r.i = i;
    r.h = Math.round(i * 137.5) % 360;
    r.dirs.forEach((d, di) => {
      d.r = r; d.i = di;
      // Расстояние вдоль направления до каждой остановки
      d.at = [0];
      for (let k = 1; k < d.st.length; k++) { const a = D.stops[d.st[k - 1]], b = D.stops[d.st[k]]; d.at.push(d.at[k - 1] + dist(a.la, a.lo, b.la, b.lo)); }
      // Расписание хранится разницами — возвращаем минуты от полуночи
      d.t = d.t.map(a => { let s = 0; return a.map(x => s += x); });
      // Конечная без названия — называем направление по предпоследней остановке
      d.to = D.stops[d.st[d.st.length - 1]].n;
      if (d.to === 'Конечная') d.to = D.stops[d.st[d.st.length - 2]].n;
    });
  });
  D.stops.forEach((s, i) => { s.i = i; s.on = []; });
  D.routes.forEach(r => r.dirs.forEach(d => d.st.forEach((si, k) => { if (k < d.st.length - 1) D.stops[si].on.push([d, k]); })));
}
function refsAt(s) { const seen = {}; return s.on.map(([d]) => d.r).filter(r => !seen[r.id] && (seen[r.id] = 1)); }

// Где автобус на направлении: ближайший отрезок между остановками
function project(d, la, lo) {
  let best = { m: 1e9, at: 0 };
  for (let k = 0; k < d.st.length - 1; k++) {
    const a = D.stops[d.st[k]], b = D.stops[d.st[k + 1]];
    const ky = 111320, kx = 111320 * Math.cos(a.la * Math.PI / 180);
    const bx = (b.lo - a.lo) * kx, by = (b.la - a.la) * ky, px = (lo - a.lo) * kx, py = (la - a.la) * ky;
    const L = bx * bx + by * by;
    const f = L ? Math.max(0, Math.min(1, (px * bx + py * by) / L)) : 0;
    const m = Math.hypot(px - f * bx, py - f * by);
    if (m < best.m) best = { m, at: d.at[k] + f * Math.sqrt(L) };
  }
  return best;
}
function placeBuses(list) {
  const t = Date.now();
  return list.filter(b => {
    const r = D.byId[b.r]; if (!r) return false;
    b.route = r;
    const h = hist[b.p] || (hist[b.p] = { la: b.la, lo: b.lo, pla: b.la, plo: b.lo, moved: t, first: t, at: [] });
    // Курс — по тому, куда автобус сдвинулся с прошлого раза
    if (dist(h.pla, h.plo, b.la, b.lo) > 8) { h.head = bearing(h.pla, h.plo, b.la, b.lo); h.pla = b.la; h.plo = b.lo; }
    if (dist(h.la, h.lo, b.la, b.lo) > 25) { h.moved = t; h.la = b.la; h.lo = b.lo; }
    // Стоит больше 10 минут — скорее всего закончил смену
    b.park = t - h.moved > 600000;
    const pr = r.dirs.map(d => project(d, b.la, b.lo));
    let di;
    if ((b.s === 1 || b.s === 2) && r.dirs[b.s - 1]) di = b.s - 1;
    else {
      // Сервер почти всегда не знает направление: смотрим, куда автобус сдвинулся
      const fwd = pr.map((p, i) => h.at[i] != null && p.m < 150 && p.at - h.at[i] > 15);
      if (fwd.filter(Boolean).length === 1) di = fwd.indexOf(true);
      else if (h.dir != null && pr[h.dir] && pr[h.dir].m < 150) di = h.dir;
      else di = pr.reduce((bi, p, i) => p.m < pr[bi].m ? i : bi, 0);
    }
    pr.forEach((p, i) => h.at[i] = p.at);
    h.dir = di;
    b.d = r.dirs[di]; b.at = pr[di].at; b.off = pr[di].m;
    // Пока автобус не сдвинулся — курс по участку маршрута, на котором он стоит
    b.head = h.head != null ? h.head : segHead(b.d, b.at);
    return true;
  });
}
function bearing(a, b, c, d) { const k = Math.PI / 180; return (Math.atan2((d - b) * Math.cos(a * k), c - a) / k + 360) % 360; }
function segHead(d, at) {
  let k = 0; while (k < d.st.length - 2 && d.at[k + 1] < at) k++;
  const a = D.stops[d.st[k]], b = D.stops[d.st[k + 1]];
  return bearing(a.la, a.lo, b.la, b.lo);
}
// Через сколько минут автобусы направления будут у остановки k
function liveEta(d, k) {
  const res = [];
  for (const b of buses) {
    if (b.d !== d || b.park || b.off > 250) continue;
    const left = d.at[k] - b.at;
    if (left < -30) continue;
    res.push(Math.max(0, left) / SPEED);
  }
  return res.sort((a, b) => a - b);
}
function nextSched(d, k, n) { const now = nowMin(); return (d.t[k] || []).filter(x => x >= now - 0.5).slice(0, n); }
function arrivals(d, k) { return { live: liveEta(d, k).filter(m => m < 60), sch: nextSched(d, k, 3) }; }

// ---------- Карта ----------
function initMap() {
  map = L.map('map', { zoomControl: false, preferCanvas: true }).setView(me ? [me.la, me.lo] : [41.6415, 41.6262], 15);
  // Тёмная карта OpenFreeMap — бесплатно и без ключа; подписи улиц по-русски
  const base = L.maplibreGL({ style: 'https://tiles.openfreemap.org/styles/dark', attribution: '© OpenFreeMap © OpenStreetMap' }).addTo(map);
  base.getMaplibreMap().once('load', e => {
    const m = e.target;
    m.getStyle().layers.forEach(l => { if (l.layout && l.layout['text-field']) m.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:ru'], ['get', 'name']]); });
  });
  stopLayer = L.layerGroup().addTo(map);
  routeLayer = L.layerGroup().addTo(map);
  busLayer = L.layerGroup().addTo(map);
  stopIcons = L.layerGroup().addTo(map);
  D.stops.forEach(s => {
    s.mk = L.circleMarker([s.la, s.lo], { radius: 3, weight: 1.5, color: '#0b0d12', fillColor: '#e8c99c', fillOpacity: 1 }).addTo(stopLayer).on('click', () => go({ k: 'stop', s: s.i }));
  });
  map.on('zoomend moveend', stopSize);
  // Пока карта меняет масштаб, автобусы не «плывут», а сразу встают на место
  // Издалека автобусы меньше, чтобы не закрывали город
  const busScale = () => document.body.classList.toggle('far', map.getZoom() < 15);
  map.on('zoomend', busScale); busScale();
  map.on('zoomstart', () => document.body.classList.add('zooming'));
  map.on('zoomend', () => setTimeout(() => document.body.classList.remove('zooming'), 50));
  map.on('contextmenu', e => go({ k: 'trip', to: { n: 'Точка на карте', la: e.latlng.lat, lo: e.latlng.lng }, opt: 0 }));
  stopSize();
  drawMe();
}
// Издалека — золотые точки; вблизи — плашки с автобусом (только те, что на экране)
// В маршруте видны только его остановки, тем же видом; пройденные выбранным автобусом — бледные
function stopSize() {
  const z = map.getZoom(), near = z >= 16;
  let only = null, dim = new Set();
  if (view.k === 'route') {
    const d = D.routes[view.r].dirs[view.d], sb = selBus();
    only = new Set(d.st);
    if (sb) d.st.slice(0, sb.k).forEach(si => dim.add(si));
  }
  // В поездке — остановки, мимо которых едем, тем же видом
  if (view.k === 'trip') {
    only = new Set();
    const o = tripPlans()[view.opt];
    if (o) o.legs.forEach(l => l.d.st.slice(l.k, l.j + 1).forEach(si => only.add(si)));
  }
  const sel = view.k === 'stop' ? view.s : view.k === 'route' ? view.hi : null;
  D.stops.forEach(s => {
    const vis = !near && (!only || only.has(s.i));
    if (!vis) { stopLayer.removeLayer(s.mk); return; }
    const o = dim.has(s.i) ? .35 : 1;
    s.mk.setStyle({ opacity: o, fillOpacity: o, radius: z >= 15 ? 4 : z >= 13 ? 3 : 2 });
    if (!stopLayer.hasLayer(s.mk)) stopLayer.addLayer(s.mk);
  });
  stopIcons.clearLayers();
  if (!near) return;
  const b = map.getBounds().pad(0.2);
  D.stops.forEach(s => {
    if (!b.contains([s.la, s.lo]) || only && !only.has(s.i)) return;
    const on = sel === s.i;
    L.marker([s.la, s.lo], { icon: L.divIcon({ className: '', html: `<div class="stp${on ? ' sel' : ''}${dim.has(s.i) ? ' dim' : ''}">${ICON.bus}</div>`, iconSize: on ? [30, 30] : [22, 22] }), zIndexOffset: on ? 400 : 0 }).addTo(stopIcons).on('click', () => go({ k: 'stop', s: s.i }));
  });
}
// Автобус, на который нажали: он сам и номер следующей остановки на его направлении
function selBus() {
  if (view.k !== 'route' || !view.p) return null;
  const d = D.routes[view.r].dirs[view.d], b = buses.find(x => x.p === view.p && x.d === d);
  if (!b) return null;
  const k = d.at.findIndex(a => a > b.at + 15);
  return { b, d, k: k < 0 ? d.st.length - 1 : k };
}
function drawMe() {
  if (!me) return;
  if (!meMarker) meMarker = L.marker([me.la, me.lo], { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [16, 16] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
  else meMarker.setLatLng([me.la, me.lo]);
}
function drawBuses() {
  const r = view.k === 'route' ? D.routes[view.r] : null;
  // В поездке — только автобусы выбранного варианта
  const tr = view.k === 'trip' ? new Set(((tripPlans()[view.opt] || {}).legs || []).map(l => l.d.r)) : null;
  const seen = {};
  for (const b of buses) {
    if (r && b.route !== r) continue;
    if (tr && !tr.has(b.route)) continue;
    seen[b.p] = 1;
    let m = busMarkers[b.p];
    const on = view.k === 'route' && view.p === b.p;
    const html = `<div class="bus${b.park ? ' park' : ''}${on ? ' on' : ''}" style="--h:${b.route.h}">${BUS_PIN}<b${b.route.ref.length > 2 ? ' class="s"' : ''}>${esc(b.route.ref)}</b></div>`;
    if (!m) {
      m = busMarkers[b.p] = L.marker([b.la, b.lo], { icon: L.divIcon({ className: 'busmk', html, iconSize: [40, 40] }), zIndexOffset: 500 }).addTo(busLayer);
      m.on('click', () => { const x = buses.find(y => y.p === b.p); if (x) go({ k: 'route', r: x.route.i, d: x.d.i, p: x.p }); });
    } else {
      m.setLatLng([b.la, b.lo]);
      if (m._h !== html) { m.setIcon(L.divIcon({ className: 'busmk', html, iconSize: [40, 40] })); m._deg = null; }
    }
    m.setZIndexOffset(on ? 800 : 500);
    m._h = html;
    // Поворачиваем автобус без перерисовки метки — так он плавно доворачивает
    const nose = m.getElement() && m.getElement().querySelector('svg');
    if (nose) {
      const prev = m._deg ?? b.head;
      const deg = prev + ((b.head - prev + 540) % 360 - 180);
      m._deg = deg;
      nose.style.transform = `rotate(${deg}deg)`;
    }
  }
  for (const p in busMarkers) if (!seen[p]) { busLayer.removeLayer(busMarkers[p]); delete busMarkers[p]; }
}
function drawRoute() {
  routeLayer.clearLayers();
  stopSize();
  const selS = view.k === 'stop' ? view.s : view.k === 'route' ? view.hi : null;
  if (selS != null && map.getZoom() < 16) { const s = D.stops[selS]; L.marker([s.la, s.lo], { icon: L.divIcon({ className: '', html: `<div class="stp sel">${ICON.bus}</div>`, iconSize: [30, 30] }), interactive: false, zIndexOffset: 400 }).addTo(routeLayer); }
  if (view.k === 'trip') return drawTrip();
  if (view.k !== 'route') return;
  // Только выбранное направление: так видно, по какой стороне и куда едет
  const r = D.routes[view.r], d = r.dirs[view.d], col = `hsl(${r.h} 60% 55%)`, last = d.st.length - 1;
  const line = p => L.polyline(p, { color: col, weight: 6, opacity: .9, interactive: false }).addTo(routeLayer);
  const sb = selBus();
  if (sb) {
    // Пройденное — бледно, впереди — ярко со стрелками
    if (sb.k > 0) L.polyline(ridePath(d, 0, sb.k), { color: col, weight: 5, opacity: .25, interactive: false }).addTo(routeLayer);
    const ahead = aheadPath(sb, last);
    line(ahead); arrows(ahead);
  } else { const p = ridePath(d, 0, last); line(p); arrows(p); }
  // Точки остановок — поверх линии
  stopLayer.eachLayer(m => m.bringToFront());
}
// Путь впереди автобуса: от ближайшей к нему точки линии, а не прямой до следующей остановки
function aheadPath(sb, last) {
  const d = sb.d, rest = ridePath(d, sb.k, last);
  if (!d.g || sb.k === 0) return [[sb.b.la, sb.b.lo], ...rest];
  const from = d.gi[sb.k - 1], to = d.gi[sb.k];
  let bi = to, bm = 1e9;
  for (let i = from; i <= to; i++) { const m = dist(d.g[i][0], d.g[i][1], sb.b.la, sb.b.lo); if (m < bm) { bm = m; bi = i; } }
  return [[sb.b.la, sb.b.lo], ...d.g.slice(bi + 1, to), ...rest];
}
// Стрелки по линии через каждые ~350 м
function arrows(p) {
  let acc = 175;
  for (let i = 1; i < p.length; i++) {
    const a = p[i - 1], b = p[i], m = dist(a[0], a[1], b[0], b[1]);
    acc += m;
    if (acc < 350 || m < 8) continue;
    acc = 0;
    L.marker([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], { icon: L.divIcon({ className: '', html: `<div class="arw" style="transform:rotate(${bearing(a[0], a[1], b[0], b[1])}deg)">${CHEV}</div>`, iconSize: [14, 14] }), interactive: false }).addTo(routeLayer);
  }
}
// Кусок линии маршрута между двумя остановками направления
function ridePath(d, k, j) {
  // Линия по улицам из data.json (tools/build_lines.py); без неё — старая линия перевозчика
  if (d.g) return d.g.slice(d.gi[k], d.gi[j] + 1);
  const L0 = d.r.line, n = L0.length;
  if (n < 2) return d.st.slice(k, j + 1).map(si => [D.stops[si].la, D.stops[si].lo]);
  const near = s => { let bi = 0, bm = 1e9; L0.forEach((p, i) => { const m = dist(p[0], p[1], s.la, s.lo); if (m < bm) { bm = m; bi = i; } }); return bi; };
  const idx = d.st.slice(k, j + 1).map(si => near(D.stops[si]));
  const out = [];
  for (let q = 0; q < idx.length - 1; q++) {
    const a = idx[q], b = idx[q + 1], fw = (b - a + n) % n, bw = (a - b + n) % n;
    // Между соседними остановками идём по линии коротким путём
    const seg = [];
    if (fw <= bw) for (let x = 0; x <= fw; x++) seg.push(L0[(a + x) % n]);
    else for (let x = 0; x <= bw; x++) seg.push(L0[(a - x + n) % n]);
    // Линия ушла в петлю (намного длиннее прямой) — рисуем напрямую между остановками
    const s1 = D.stops[d.st[k + q]], s2 = D.stops[d.st[k + q + 1]];
    let len = 0; for (let x = 1; x < seg.length; x++) len += dist(seg[x - 1][0], seg[x - 1][1], seg[x][0], seg[x][1]);
    if (len > 2 * dist(s1.la, s1.lo, s2.la, s2.lo) + 250) out.push([s1.la, s1.lo], [s2.la, s2.lo]);
    else out.push(...seg);
  }
  return out;
}
// Пеший путь по улицам и тропинкам — от OpenStreetMap (routing.openstreetmap.de), бесплатно и без ключа.
// Пока ответа нет или нет интернета — бледная прямая
const foot = {};
function footPath(a, b) {
  if (dist(a[0], a[1], b[0], b[1]) < 40) return [a, b];
  const k = [a, b].map(p => p[0].toFixed(5) + ',' + p[1].toFixed(5)).join(';');
  if (foot[k] !== undefined) return foot[k];
  foot[k] = null;
  fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`)
    .then(r => r.json()).then(j => {
      const c = j.routes[0].geometry.coordinates.map(([lo, la]) => [la, lo]);
      foot[k] = [a, ...c, b];
      if (view.k === 'trip') drawRoute();
    }).catch(() => {});
  return null;
}
function drawWalk(a, b) {
  const p = footPath(a, b);
  L.polyline(p || [a, b], { color: '#eef0f4', weight: 3, opacity: p ? .85 : .35, dashArray: '2 7', lineCap: 'round', interactive: false }).addTo(routeLayer);
}
function drawTrip() {
  const pl = tripPlans(), o = pl[view.opt];
  const to = view.to, from = tripFrom();
  L.marker([to.la, to.lo], { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [30, 30], iconAnchor: [4, 34] }), interactive: false, zIndexOffset: 900 }).addTo(routeLayer);
  if (!o) return;
  let cur = [from.la, from.lo];
  o.legs.forEach(l => {
    const a = D.stops[l.d.st[l.k]], b = D.stops[l.d.st[l.j]];
    drawWalk(cur, [a.la, a.lo]);
    L.polyline(ridePath(l.d, l.k, l.j), { color: `hsl(${l.d.r.h} 62% 55%)`, weight: 6, opacity: .95, interactive: false }).addTo(routeLayer);
    [a, b].forEach(s => L.circleMarker([s.la, s.lo], { radius: 6, weight: 3, color: `hsl(${l.d.r.h} 62% 55%)`, fillColor: '#0b0d12', fillOpacity: 1, interactive: false }).addTo(routeLayer));
    cur = [b.la, b.lo];
  });
  drawWalk(cur, [to.la, to.lo]);
  stopLayer.eachLayer(m => m.bringToFront());
}

// ---------- Живые данные ----------
async function poll() {
  if (document.hidden) return;
  if (!S.live) return setLive();
  try {
    const r = await fetch(S.live.replace(/\/$/, '') + '/buses', { cache: 'no-store' });
    const j = await r.json();
    buses = placeBuses(j.buses || []);
    liveOk = true; fails = 0;
  } catch (e) {
    // Три неудачи подряд — убираем автобусы, чтобы не показывать устаревшее
    if (++fails >= 3) { buses = []; liveOk = false; }
  }
  setLive(); drawBuses(); refresh();
  // Выбранный автобус проехал дальше — двигаем границу пройденного
  if (view.k === 'route' && view.p) drawRoute();
}
function setLive() {
  const el = $('live'), n = buses.filter(b => !b.park).length;
  el.classList.toggle('on', liveOk && n > 0);
  // Автобусы ходят — надпись не нужна; остаётся только «не ходят» и «нет связи»
  el.classList.toggle('hide', !!S.live && liveOk && n > 0);
  el.querySelector('span').textContent = !S.live ? 'Живые автобусы не подключены' : !liveOk ? 'Нет связи с автобусами' : n ? `${n} автобусов на линии` : 'Сейчас автобусы не ходят';
}

// ---------- Панель ----------
function go(v) { if (view.k !== 'home') back.push(view); view = v; open(); }
function goBack() { view = back.pop() || { k: 'home' }; open(); }
function open() {
  $('res').classList.remove('on');
  $('sheet').classList.remove('mini');
  showSheet();
  drawRoute(); drawBuses(); render();
  $('body').scrollTop = 0;
  // Ждём, пока панель раскроется, иначе карта уйдёт под неё
  // Карта никогда не отдаляется: только сдвигается, если нужного не видно над панелью
  setTimeout(() => {
    if (view.k === 'stop') { const s = D.stops[view.s]; showPoint(s.la, s.lo); }
    if (view.k === 'route' && !view.p) { const d = D.routes[view.r].dirs[view.d]; keepSeen(d.st.map(si => [D.stops[si].la, D.stops[si].lo])); }
    if (view.k === 'trip') { const f = tripFrom(); keepSeen([[f.la, f.lo], [view.to.la, view.to.lo]], true); }
    placeSide();
  }, 280);
}
// Видна ли точка между поиском и панелью
function seen(p) {
  const q = map.latLngToContainerPoint(p), W = map.getSize().x, bot = map.getSize().y - sheetH();
  return q.x > 30 && q.x < W - 30 && q.y > 140 && q.y < bot - 30;
}
// Поставить точку в середину свободной части экрана, масштаб z
function centerOn(la, lo, z) {
  const H = map.getSize().y, top = 110, bot = H - sheetH();
  const c = map.project([la, lo], z).add([0, H / 2 - (top + bot) / 2]);

  if (!v) {
    // Пустой поиск — избранные адреса под рукой
    if (S.places.length && document.activeElement === $('q')) { el.innerHTML = S.places.map(placeRow).join(''); el.classList.add('on'); }
    else el.classList.remove('on');
    return;
  }
  const lat = v.replace(/а/g, 'a');
  const rs = D.routes.filter(r => r.ref.toLowerCase().startsWith(lat));
  const seen = {};
  const ss = D.stops.filter(s => s.n.toLowerCase().includes(v) || String(s.c) === v)
    .filter(s => { const k = s.n + Math.round(s.la * 300) + Math.round(s.lo * 300); return !seen[k] && (seen[k] = 1); })
    .map(s => [s, me ? dist(me.la, me.lo, s.la, s.lo) : 0]).sort((a, b) => a[1] - b[1]).slice(0, 30);
  // Адреса и места: от трёх букв, сначала ближайшие
  let ps = [];
  if (v.length >= 3) {
    if (!P) { fetch('places.json').then(r => r.json()).then(j => { P = j; search(); }); }
    else {
      const qw = words(raw);
      if (qw.length) ps = P.filter(x => matches(qw, x)).map(x => [x, me ? dist(me.la, me.lo, x[1], x[2]) : 0]).sort((a, b) => (a[0][3] === 2) - (b[0][3] === 2) || a[1] - b[1]).slice(0, 25);
      // Номер дома в запросе — дома выше улиц
      if (qw.some(w => /^\d/.test(w))) ps.sort((a, b) => (b[0][3] === 2) - (a[0][3] === 2) || a[1] - b[1]);
      if (!ps.length && !rs.length && !ss.length) { if (nomi[raw]) ps = nomi[raw].map(x => [x, me ? dist(me.la, me.lo, x[1], x[2]) : 0]); else online(raw); }
    }
  }
  el.innerHTML = rs.map(r => `<button class="row" data-route="${r.i}">${numHtml(r)}<div class="info"><div class="t">Маршрут ${esc(r.ref)}</div><div class="s">${r.dirs.map(d => esc(d.to)).join(' ⇄ ')}</div></div></button>`).join('')
    + ps.map(([x, m]) => `<button class="row" data-place="${esc(JSON.stringify(x))}"><span class="rb">${ICON.pin}</span><div class="info"><div class="t">${esc(x[0])}</div><div class="s">${['место', 'улица', 'дом'][x[3]]}</div></div>${me ? `<div class="eta">${fmtD(m)}</div>` : ''}</button>`).join('')
    + ss.map(([s, m]) => `<button class="row" data-stop="${s.i}"><div class="info"><div class="t">${esc(s.n)}</div><div class="chips">${refsAt(s).map(numHtml).join('')}</div></div>${me ? `<div class="eta">${fmtD(m)}</div>` : ''}</button>`).join('')
    || `<div class="row"><div class="info"><div class="s">${nomiT && !nomi[raw] && navigator.onLine ? 'Ищу…' : 'Ничего не нашлось'}</div></div></div>`;
  el.classList.add('on');
}

function clearQ() { $('q').value = ''; $('qx').classList.remove('on'); $('q').blur(); }
function locate(fly) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    me = { la: p.coords.latitude, lo: p.coords.longitude };
    S.last = me; save(); drawMe();
    if (fly) map.setView([me.la, me.lo], Math.max(map.getZoom(), 16));
    refresh();
  }, () => { if (fly) toast('Нет доступа к геопозиции'); }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.id === 'grab') { const sh = $('sheet'); sh.classList.remove('big'); sh.classList.toggle('mini'); setTimeout(placeSide, 260); return; }
  if (t.hasAttribute('data-back')) return goBack();
  if (t.hasAttribute('data-home')) { back = []; view = { k: 'home' }; return open(); }
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.id === 'panBtn') { showSheet(); return setTimeout(placeSide, 230); }
  if (t.id === 'meBtn') return locate(true);
  if (t.id === 'setBtn') return go({ k: 'set' });
  if (t.dataset.fav != null) { const i = +t.dataset.fav, k = S.fav.indexOf(i); if (k < 0) S.fav.push(i); else S.fav.splice(k, 1); save(); t.classList.toggle('on', k < 0); toast(k < 0 ? 'В избранном' : 'Убрано из избранного'); return; }
  if (t.dataset.route != null) {
    clearQ();
    const ri = +t.dataset.route, r = D.routes[ri];
    let d = t.dataset.dir != null ? +t.dataset.dir : 0;
    const hi = t.dataset.hi ? +t.dataset.hi : null;
    // Направление не указано — берём то, что проходит ближе ко мне
    if (t.dataset.dir == null && me && r.dirs.length > 1) d = r.dirs.map(x => Math.min(...x.st.slice(0, -1).map(si => dist(me.la, me.lo, D.stops[si].la, D.stops[si].lo)))).reduce((bi, v, i, a) => v < a[bi] ? i : bi, 0);
    const v = { k: 'route', r: ri, d, hi };
    if (t.hasAttribute('data-swap')) { view = v; drawRoute(); drawBuses(); return render(); }
    return go(v);
  }
  if (t.dataset.stop != null) { clearQ(); return go({ k: 'stop', s: +t.dataset.stop }); }
  if (t.dataset.place != null) { const x = JSON.parse(t.dataset.place); clearQ(); return go({ k: 'trip', to: { n: x[0], la: x[1], lo: x[2] }, opt: 0 }); }
  if (t.dataset.tripstop != null) { const s = D.stops[+t.dataset.tripstop]; return go({ k: 'trip', to: { n: s.n, la: s.la, lo: s.lo }, opt: 0 }); }
  if (t.id === 'qx') { $('q').value = ''; $('q').focus(); search(); return; }
  if (t.hasAttribute('data-pfav')) {
    const i = placeIdx(view.to);
    if (i < 0) { S.places.push({ n: view.to.n, la: view.to.la, lo: view.to.lo }); toast('В избранном'); } else { S.places.splice(i, 1); toast('Убрано из избранного'); }
    save(); return render(true);
  }
  if (t.dataset.label != null) {
    const p = S.places[placeIdx(view.to)];
    if (p) { const l = p.label === t.dataset.label ? '' : t.dataset.label; if (l === 'Дом') clearHome(); p.label = l; save(); render(true); }
    return;
  }
  if (t.hasAttribute('data-nohome')) return toast('Откройте свою остановку и нажмите «Это мой дом»');
  if (t.dataset.sethome != null) {
    const s = D.stops[+t.dataset.sethome], hp = S.places[homeIdx()], was = hp && hp.stop === s.i;
    clearHome();
    if (!was) S.places.unshift({ n: s.n, la: s.la, lo: s.lo, label: 'Дом', stop: s.i });
    save(); toast(was ? 'Дом убран' : 'Теперь это ваш дом'); return render(true);
  }
  if (t.dataset.homefrom != null) {
    const s = D.stops[+t.dataset.homefrom], hp = S.places[homeIdx()];
    return go({ k: 'trip', to: { n: hp.n, la: hp.la, lo: hp.lo }, from: { n: s.n, la: s.la, lo: s.lo }, opt: 0 });
  }
  if (t.dataset.pgo != null) { const p = S.places[+t.dataset.pgo]; clearQ(); return go({ k: 'trip', to: { n: p.n, la: p.la, lo: p.lo }, opt: 0 }); }
  if (t.hasAttribute('data-pickfrom')) { view.pick = !view.pick; return render(); }
  if (t.dataset.from != null) {
    const s = D.stops[+t.dataset.from];
    if (t.dataset.from === 'me') delete view.from; else view.from = { n: s.n, la: s.la, lo: s.lo, stop: s.i };
    view.pick = false; view.opt = 0; drawRoute(); drawBuses(); return render();
  }
  if (t.dataset.opt != null) { view.opt = +t.dataset.opt; drawRoute(); drawBuses(); return render(true); }
  if (t.id === 'liveSave') { S.live = $('liveUrl').value.trim(); save(); fails = 0; $('liveUrl').blur(); toast('Сохранено'); poll(); return; }
  if (t.id === 'bk') { const s = JSON.stringify({ fav: S.fav, places: S.places }); $('bkt').value = s; $('bkt').select(); try { navigator.clipboard.writeText(s); toast('Скопировано'); } catch (er) { toast('Выделено — скопируйте'); } return; }
  if (t.id === 'rs') { try { const j = JSON.parse($('bkt').value); S.fav = j.fav || []; S.places = j.places || []; save(); toast('Восстановлено'); } catch (er) { toast('Не похоже на копию'); } return; }
});
$('q').addEventListener('input', search);
// Своё название избранного адреса — сохраняется по ходу набора
document.addEventListener('input', e => { if (e.target.id === 'labelIn') { const p = S.places[placeIdx(view.to)]; if (p) { p.label = e.target.value.trim(); save(); } } });
$('q').addEventListener('focus', () => { $('sheet').classList.add('mini'); placeSide(); search(); });
$('q').addEventListener('blur', () => setTimeout(() => { if (!$('q').value) { $('res').classList.remove('on'); $('sheet').classList.remove('mini'); setTimeout(placeSide, 260); } }, 150));
// Панель тянется пальцем. Вниз — за полоску, заголовок или содержимое, когда оно прокручено до верха;
// влево и вправо — из любого места. Главная, настройки и остановка закрываются свайпом вниз,
// любая панель — свайпом в сторону; поездка и маршрут вниз только сворачиваются, чтобы видеть карту
let drag = null;
const downCloses = () => view.k === 'home' || view.k === 'set' || view.k === 'stop';
$('sheet').addEventListener('touchstart', e => {
  const t = e.touches[0];
  drag = { x: t.clientX, y: t.clientY, dx: 0, dy: 0, ax: null, top: !!e.target.closest('#grab,.hd') || $('body').scrollTop <= 0, hd: !!e.target.closest('#grab,.hd'), inp: !!e.target.closest('input,textarea') };
}, { passive: true });
$('sheet').addEventListener('touchmove', e => {
  if (!drag) return;
  const t = e.touches[0];
  drag.dx = t.clientX - drag.x; drag.dy = t.clientY - drag.y;
  if (!drag.ax) {
    if (Math.max(Math.abs(drag.dx), Math.abs(drag.dy)) < 8) return;
    drag.ax = Math.abs(drag.dx) > Math.abs(drag.dy) ? 'x' : 'y';
    // Вверх внутри списка и вниз посреди прокрутки — это прокрутка, а не перетаскивание
    if (drag.ax === 'y' && (!drag.top || drag.dy < 0 && !drag.hd)) { drag = null; return; }
    if (drag.ax === 'x' && drag.inp) { drag = null; return; }
    $('sheet').classList.add('drag');
  }
  e.preventDefault();
  const sh = $('sheet');
  if (drag.ax === 'x') { sh.style.transform = `translateX(${drag.dx}px)`; sh.style.opacity = 1 - Math.min(.5, Math.abs(drag.dx) / 600); }
  else sh.style.transform = drag.dy > 0 ? `translateY(${drag.dy}px)` : '';
}, { passive: false });
// Панель уезжает за край и закрывается
function flyOff(tr) {
  const sh = $('sheet');
  sh.classList.remove('drag'); sh.style.transform = tr; sh.style.opacity = '0';
  setTimeout(() => {
    sh.classList.add('drag'); sh.style.transform = ''; sh.style.opacity = '';
    closeSheet();
    requestAnimationFrame(() => requestAnimationFrame(() => sh.classList.remove('drag')));
  }, 220);
}
$('sheet').addEventListener('touchend', () => {
  if (!drag) return;
  const sh = $('sheet'), { dx, dy, ax } = drag; drag = null;
  if (!ax) return;
  if (ax === 'x' && Math.abs(dx) > 70) return flyOff(`translateX(${dx > 0 ? 110 : -110}%)`);
  if (ax === 'y' && dy > 70 && !sh.classList.contains('big') && downCloses()) return flyOff('translateY(110%)');
  sh.classList.remove('drag'); sh.style.transform = ''; sh.style.opacity = '';
  if (ax === 'x') return;
  if (dy > 50) { if (sh.classList.contains('big')) sh.classList.remove('big'); else sh.classList.add('mini'); }
  else if (dy < -40) { if (sh.classList.contains('mini')) sh.classList.remove('mini'); else sh.classList.add('big'); }
  setTimeout(placeSide, 260);
});
// Свёрнутую панель раскрывает нажатие в любом её месте
$('sheet').addEventListener('click', e => { const sh = $('sheet'); if (sh.classList.contains('mini') && e.target.id !== 'grab') { sh.classList.remove('mini'); setTimeout(placeSide, 260); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); locate(); } });

fetch('data.json').then(r => r.json()).then(d => {
  D = d; prepare(); initMap(); render(); setLive(); locate();
  poll(); setInterval(poll, 8000);
  // «Через N мин» и расписание пересчитываются и без новых данных
  setInterval(refresh, 30000);
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
