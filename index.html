<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bus">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<title>Bus</title>
<style>
:root{--bg:#0b0d12;--card:#12151c;--line:#232835;--key:#1a1e27;--text:#eef0f4;--muted:#8a909c;--acc:#5aa9ff;--green:#4cc38a;--amber:#f0b35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;min-height:calc(100lvh + 1px);background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
#map{position:fixed;inset:0;background:#0e1014}
.leaflet-container{background:#0e1014;font:inherit}
.leaflet-control-attribution{background:rgba(11,13,18,.7)!important;color:#5c626e!important;font-size:9px}
.leaflet-control-attribution a{color:#6f7b8e!important}
.leaflet-top{top:calc(env(safe-area-inset-top) + 74px)}
/* Верх: поиск и связь */
#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 22px);z-index:500;display:flex;gap:8px}
.glass{background:rgba(18,21,28,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px}
#q{flex:1;min-width:0;height:46px;padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none}
#q::placeholder{color:var(--muted)}
.ib{width:46px;height:46px;flex:none;display:grid;place-items:center}
.ib svg{width:21px;height:21px}
#live{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 76px);z-index:400;font-size:12px;padding:5px 10px;border-radius:20px;color:var(--muted);white-space:nowrap}
#live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
#live.on i{background:var(--green)}
#res{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 76px);z-index:600;max-height:55vh;overflow-y:auto;display:none}
#res.on{display:block}
/* Справа: кнопка «где я» */
#side{position:fixed;right:12px;bottom:50vh;z-index:450;overflow:hidden}
#side button{width:46px;height:46px;display:grid;place-items:center;color:var(--acc)}
#side svg{width:21px;height:21px}
/* Нижняя панель */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;border-radius:22px 22px 0 0;border-bottom:0;display:flex;flex-direction:column;max-height:46vh;transition:max-height .25s;padding-bottom:env(safe-area-inset-bottom)}
/* Фон панели продолжается под низ экрана: на iPhone с экрана «Домой» иначе остаётся щель */
#sheet:after{content:"";position:absolute;left:-1px;right:-1px;top:100%;height:200px;background:inherit;-webkit-backdrop-filter:inherit;backdrop-filter:inherit}
#sheet.big{max-height:82vh}
#sheet.mini{max-height:calc(26px + env(safe-area-inset-bottom))}
#grab{height:24px;flex:none;display:grid;place-items:center;width:100%}
#grab:after{content:"";width:38px;height:5px;border-radius:3px;background:#3a3f4c}
#body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;flex:1}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd .tt{flex:1;min-width:0}
.hd .t{font-size:20px;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hd .s{font-size:13px;color:var(--muted);margin-top:3px}
.rb{width:38px;height:38px;flex:none;border-radius:50%;background:var(--key);display:grid;place-items:center;color:var(--muted)}
.rb svg{width:17px;height:17px}
.rb.on{color:var(--amber)}
.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.sec:first-child{margin-top:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:11px 12px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .info{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{flex:none;min-width:42px;height:30px;padding:0 7px;border-radius:9px;background:hsl(var(--h) 60% 52%);color:#081018;font-weight:800;font-size:15px;display:inline-grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips .num{min-width:36px;height:28px;font-size:14px;border-radius:8px}
.eta{flex:none;text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.eta b{display:block;font-size:19px;color:var(--green);font-weight:700}
.eta b.sch{color:var(--text);font-weight:600;font-size:17px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-width:0;height:34px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.seg button.on{background:#262b36;color:var(--text);font-weight:600}
.tip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.tip .m{color:var(--muted)}
.tip b.g{color:var(--green)}
.stops{position:relative;padding-left:24px}
.stops:before{content:"";position:absolute;left:7px;top:18px;bottom:18px;width:3px;border-radius:2px;background:hsl(var(--h) 45% 32%)}
.sp{position:relative;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 0;font-size:15px;min-height:38px}
.sp:before{content:"";position:absolute;left:-22px;top:50%;margin-top:-6px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid hsl(var(--h) 60% 55%)}
.sp .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .w{flex:none;font-size:13px;color:var(--green);font-weight:600}
.sp.me .n{color:var(--acc);font-weight:600}
.sp.me:before{background:var(--acc);border-color:var(--acc)}
.busin{position:relative;height:0}
.busin span{position:absolute;left:-30px;top:-10px;width:20px;height:20px;border-radius:6px;background:hsl(var(--h) 60% 52%);display:grid;place-items:center;z-index:1;border:2px solid var(--bg)}
.busin svg{width:11px;height:11px;color:#081018}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:46px;border-radius:14px;background:var(--key);border:1px solid var(--line);font-weight:600;font-size:15px;display:grid;place-items:center;text-decoration:none;color:var(--text)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px;line-height:1.5}
.field{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 12px;font-size:15px;outline:none}
textarea.field{height:80px;padding:10px;font-size:12px;margin-top:8px}
/* Метки на карте */
.bus{position:relative;width:30px;height:30px}
.bus b{position:absolute;inset:0;border-radius:50%;background:hsl(var(--h) 62% 55%);color:#081018;font-weight:800;font-size:12px;letter-spacing:-.3px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.55);z-index:1}
/* «Нос» — куда едет автобус; поворачивается вокруг метки */
.bus i{position:absolute;inset:-8px;transition:transform .8s ease}
.bus i:before{content:"";position:absolute;left:50%;top:0;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom:9px solid #fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.bus.nodir i{display:none}
.bus.park{opacity:.35}
.busmk{transition:transform 1.4s linear}
.zooming .busmk{transition:none}
/* Остановка вблизи: тёмная плашка с золотым автобусом, как иконка приложения */
.stp{width:22px;height:22px;border-radius:7px;background:#14171e;border:1.5px solid rgba(232,201,156,.75);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.stp svg{width:12px;height:12px;color:#e8c99c}
.stp.sel{width:30px;height:30px;border-radius:9px;background:#e8c99c;border-color:#fff}
.stp.sel svg{width:16px;height:16px;color:#14171e}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#e8c99c;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.pin:after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#14171e}
/* Поездка */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.opt.on{border-color:rgba(232,201,156,.6)}
.opt .top{display:flex;align-items:baseline;gap:8px}
.opt .top b{font-size:20px}
.opt .top span{color:var(--muted);font-size:14px}
.opt .top em{margin-left:auto;font-style:normal;font-size:13px;color:var(--green);font-weight:600}
.legs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
.legs .num{min-width:34px;height:24px;font-size:13px;border-radius:7px}
.legs svg{width:14px;height:14px;vertical-align:-2px}
.steps{margin:4px 0 0;padding:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:9px 2px;font-size:15px;line-height:1.35}
.step+.step{border-top:1px solid var(--line)}
.step .ic{flex:none;width:42px;display:grid;place-items:center;color:var(--muted)}
.step .ic svg{width:18px;height:18px}
.step .m{color:var(--muted);font-size:13px}
.step .g{color:var(--green);font-weight:600}
.me-dot{width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 6px rgba(90,169,255,.25)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 100px);transform:translateX(-50%);background:#262b36;padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;z-index:900;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <input id="q" class="glass" type="search" placeholder="Куда едем?" autocomplete="off">
  <button class="glass ib" id="setBtn" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>
<div id="live" class="glass"><i></i><span>Загрузка…</span></div>
<div id="res" class="glass"></div>
<div id="side" class="glass"><button id="meBtn" aria-label="Где я"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></div>
<div id="sheet" class="glass"><button id="grab" aria-label="Развернуть"></button><div id="body"></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
const KEY = 'bus-data';
// Версия приложения — называть Андрею перед каждой публикацией
const VERSION = '2.2';
// Адрес посредника (Cloudflare Worker); можно поменять в настройках
const DEFAULT_LIVE = 'https://bus-proxy.andriiborush.workers.dev';
// Метров по прямой в минуту — средняя скорость городского автобуса с остановками
const SPEED = 230;
const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  bus: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2v2h-3v-2H9v2H6v-2a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 3v5h12V6z"/></svg>',
  walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.6" fill="currentColor"/><path d="M10 21l2-6 3 3v3M9 12l2-4 4 2 2 3M11 8l-3 2-1 3"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};
let P = null; // адреса и места — грузятся при первом поиске
let D, map, stopLayer, stopIcons, routeLayer, busLayer, meMarker;
let S = load();
let me = S.last || null;
let buses = [], liveOk = false, fails = 0;
// По госномеру: где был, когда двигался, где был на каждом направлении
const hist = {};
const busMarkers = {};
let view = { k: 'home' }, back = [];

function load() { try { return Object.assign({ fav: [], live: DEFAULT_LIVE }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return { fav: [], live: DEFAULT_LIVE }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function dist(a, b, c, d) { const k = Math.PI / 180, x = (d - b) * k * Math.cos((a + c) / 2 * k), y = (c - a) * k; return Math.sqrt(x * x + y * y) * 6371000; }
const walk = m => Math.max(1, Math.round(m * 1.3 / 80));
const fmtD = m => m < 1000 ? Math.round(m / 10) * 10 + ' м' : (m / 1000).toFixed(1).replace('.', ',') + ' км';
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m) % 60).padStart(2, '0');
const mins = m => (Math.round(m) || '<1') + ' мин';
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }
const numHtml = r => `<span class="num" style="--h:${r.h}">${esc(r.ref)}</span>`;

// ---------- Данные ----------
function prepare() {
  D.byId = {};
  D.routes.forEach((r, i) => {
    D.byId[r.id] = r;
    r.i = i;
    r.h = Math.round(i * 137.5) % 360;
    r.dirs.forEach((d, di) => {
      d.r = r; d.i = di;
      // Расстояние вдоль направления до каждой остановки
      d.at = [0];
      for (let k = 1; k < d.st.length; k++) { const a = D.stops[d.st[k - 1]], b = D.stops[d.st[k]]; d.at.push(d.at[k - 1] + dist(a.la, a.lo, b.la, b.lo)); }
      // Расписание хранится разницами — возвращаем минуты от полуночи
      d.t = d.t.map(a => { let s = 0; return a.map(x => s += x); });
      // Конечная без названия — называем направление по предпоследней остановке
      d.to = D.stops[d.st[d.st.length - 1]].n;
      if (d.to === 'Конечная') d.to = D.stops[d.st[d.st.length - 2]].n;
    });
  });
  D.stops.forEach((s, i) => { s.i = i; s.on = []; });
  D.routes.forEach(r => r.dirs.forEach(d => d.st.forEach((si, k) => { if (k < d.st.length - 1) D.stops[si].on.push([d, k]); })));
}
function refsAt(s) { const seen = {}; return s.on.map(([d]) => d.r).filter(r => !seen[r.id] && (seen[r.id] = 1)); }

// Где автобус на направлении: ближайший отрезок между остановками
function project(d, la, lo) {
  let best = { m: 1e9, at: 0 };
  for (let k = 0; k < d.st.length - 1; k++) {
    const a = D.stops[d.st[k]], b = D.stops[d.st[k + 1]];
    const ky = 111320, kx = 111320 * Math.cos(a.la * Math.PI / 180);
    const bx = (b.lo - a.lo) * kx, by = (b.la - a.la) * ky, px = (lo - a.lo) * kx, py = (la - a.la) * ky;
    const L = bx * bx + by * by;
    const f = L ? Math.max(0, Math.min(1, (px * bx + py * by) / L)) : 0;
    const m = Math.hypot(px - f * bx, py - f * by);
    if (m < best.m) best = { m, at: d.at[k] + f * Math.sqrt(L) };
  }
  return best;
}
function placeBuses(list) {
  const t = Date.now();
  return list.filter(b => {
    const r = D.byId[b.r]; if (!r) return false;
    b.route = r;
    const h = hist[b.p] || (hist[b.p] = { la: b.la, lo: b.lo, pla: b.la, plo: b.lo, moved: t, first: t, at: [] });
    // Курс — по тому, куда автобус сдвинулся с прошлого раза
    if (dist(h.pla, h.plo, b.la, b.lo) > 8) { h.head = bearing(h.pla, h.plo, b.la, b.lo); h.pla = b.la; h.plo = b.lo; }
    if (dist(h.la, h.lo, b.la, b.lo) > 25) { h.moved = t; h.la = b.la; h.lo = b.lo; }
    // Стоит больше 10 минут — скорее всего закончил смену
    b.park = t - h.moved > 600000;
    const pr = r.dirs.map(d => project(d, b.la, b.lo));
    let di;
    if ((b.s === 1 || b.s === 2) && r.dirs[b.s - 1]) di = b.s - 1;
    else {
      // Сервер почти всегда не знает направление: смотрим, куда автобус сдвинулся
      const fwd = pr.map((p, i) => h.at[i] != null && p.m < 150 && p.at - h.at[i] > 15);
      if (fwd.filter(Boolean).length === 1) di = fwd.indexOf(true);
      else if (h.dir != null && pr[h.dir] && pr[h.dir].m < 150) di = h.dir;
      else di = pr.reduce((bi, p, i) => p.m < pr[bi].m ? i : bi, 0);
    }
    pr.forEach((p, i) => h.at[i] = p.at);
    h.dir = di;
    b.d = r.dirs[di]; b.at = pr[di].at; b.off = pr[di].m;
    // Пока автобус не сдвинулся — курс по участку маршрута, на котором он стоит
    b.head = h.head != null ? h.head : segHead(b.d, b.at);
    return true;
  });
}
function bearing(a, b, c, d) { const k = Math.PI / 180; return (Math.atan2((d - b) * Math.cos(a * k), c - a) / k + 360) % 360; }
function segHead(d, at) {
  let k = 0; while (k < d.st.length - 2 && d.at[k + 1] < at) k++;
  const a = D.stops[d.st[k]], b = D.stops[d.st[k + 1]];
  return bearing(a.la, a.lo, b.la, b.lo);
}
// Через сколько минут автобусы направления будут у остановки k
function liveEta(d, k) {
  const res = [];
  for (const b of buses) {

// ---------- Живые данные ----------

            const mb = Bm.get(d2.st[j2]); if (mb == null) continue;
            const tt = w2.w + rideMin(d2, k2, j2, w2.i) + walk(mb);
            out.push({ t: tt, legs: [{ d: d1, k: k1, j: j1, w: w1 }, { d: d2, k: k2, j: j2, w: w2 }], wa, wb: walk(mb) });
            break;
          }
        }
      }
    }
  }
  // Лучший вариант на каждый набор номеров, три самых быстрых
  const best = {};
  for (const o of out) { const k = o.legs.map(l => l.d.r.id + l.d.i).join('>'); if (!best[k] || o.t < best[k].t) best[k] = o; }
  const res = Object.values(best).sort((a, b) => a.t - b.t).slice(0, 3);
  const direct = dist(from.la, from.lo, to.la, to.lo);
  // Пешком — если близко или быстрее любого автобуса
  if (direct < 2000 && (!res.length || walk(direct) <= res[0].t)) res.unshift({ t: walk(direct), legs: [], wa: walk(direct), wb: 0 });
  return res.slice(0, 3);
}
function nearStops(x) {
  if (!x.nb) x.nb = D.stops.filter(y => dist(x.la, x.lo, y.la, y.lo) < 180);
  return x.nb;
}
function tripView() {
  const to = view.to, from = tripFrom(), pl = tripPlans();
  let h = head(esc(to.n), `от: ${esc(from.n)}`);
  if (!pl.length) return h + `<div class="empty">Не нашёл автобуса в пределах 900 м от начала и конца пути. Попробуйте другую точку.</div>`;
  const now = nowMin();
  h += pl.map((o, i) => {
    const legs = o.legs.length ? `<span>${ICON.walk} ${o.wa}</span>` + o.legs.map(l => ` › ${numHtml(l.d.r)}`).join('') + `<span> › ${ICON.walk} ${o.wb}</span>` : `<span>${ICON.walk} только пешком</span>`;
    const l0 = o.legs[0];
    const go = l0 ? (l0.w.live ? `<em>через ${mins(l0.w.w)}</em>` : `<em style="color:var(--muted)">в ${hhmm(now + l0.w.w)}</em>`) : '';
    return `<button class="opt${i === view.opt ? ' on' : ''}" data-opt="${i}"><div class="top"><b>${hhmm(now + o.t)}</b><span>${Math.round(o.t)} мин</span>${go}</div><div class="legs">${legs}</div></button>`;
  }).join('');
  const o = pl[view.opt] || pl[0];
  // Шаги выбранного варианта — коротко
  let st = '';
  if (!o.legs.length) st = `<div class="step"><div class="ic">${ICON.walk}</div><div>Пешком до места<div class="m">${o.wa} мин</div></div></div>`;
  o.legs.forEach((l, q) => {
    const a = D.stops[l.d.st[l.k]], b = D.stops[l.d.st[l.j]];
    const walkTo = q === 0 ? `${o.wa} мин` : 'пересадка';
    st += `<div class="step"><div class="ic">${ICON.walk}</div><div>${q === 0 ? 'Дойти до' : 'Перейти на'} «${esc(a.n)}»<div class="m">${walkTo}</div></div></div>`;
    st += `<div class="step"><div class="ic">${numHtml(l.d.r)}</div><div>→ ${esc(l.d.to)}<div class="m">${l.w.live ? `<span class="g">через ${mins(l.w.w)}</span>` : `по плану в ${hhmm(now + l.w.w)}`} · ${l.j - l.k} ост.</div></div></div>`;
    st += `<div class="step"><div class="ic">${ICON.flag}</div><div>Выйти на «${esc(b.n)}»</div></div>`;
  });
  if (o.legs.length) st += `<div class="step"><div class="ic">${ICON.walk}</div><div>Пешком до места<div class="m">${o.wb} мин</div></div></div>`;
  return h + `<div class="steps">${st}</div>`;
}

function setView() {
  return head('Настройки') + `<div class="sec">Живые автобусы</div><input class="field" id="liveUrl" placeholder="https://bus-proxy.….workers.dev" value="${esc(S.live || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="btns"><button class="btn" id="liveSave">Сохранить адрес</button></div>
  <div class="note">Координаты и расписание — с сервера перевозчика (thetamaps.site): без ключа, но и без официального соглашения, может перестать работать. Названия и карта — OpenStreetMap, OpenFreeMap.</div>
  <div class="sec">Копия избранного</div><div class="btns"><button class="btn" id="bk">Сохранить копию</button><button class="btn" id="rs">Восстановить</button></div><textarea class="field" id="bkt" placeholder="Сюда вставьте копию и нажмите «Восстановить»"></textarea><div class="note">Bus, версия ${VERSION}</div>`;
}

// ---------- Поиск ----------
function search() {
  const v = $('q').value.trim().toLowerCase(), el = $('res');
  if (!v) { el.classList.remove('on'); return; }
  const lat = v.replace(/а/g, 'a');
  const rs = D.routes.filter(r => r.ref.toLowerCase().startsWith(lat));
  const seen = {};
  const ss = D.stops.filter(s => s.n.toLowerCase().includes(v) || String(s.c) === v)
    .filter(s => { const k = s.n + Math.round(s.la * 300) + Math.round(s.lo * 300); return !seen[k] && (seen[k] = 1); })
    .map(s => [s, me ? dist(me.la, me.lo, s.la, s.lo) : 0]).sort((a, b) => a[1] - b[1]).slice(0, 30);
  // Адреса и места: от трёх букв, сначала ближайшие
  let ps = [];
  if (v.length >= 3) {
    if (!P) { fetch('places.json').then(r => r.json()).then(j => { P = j; search(); }); }
    else ps = P.filter(x => x[0].toLowerCase().includes(v)).map(x => [x, me ? dist(me.la, me.lo, x[1], x[2]) : 0]).sort((a, b) => (a[0][3] === 2) - (b[0][3] === 2) || a[1] - b[1]).slice(0, 25);
  }
  el.innerHTML = rs.map(r => `<button class="row" data-route="${r.i}">${numHtml(r)}<div class="info"><div class="t">Маршрут ${esc(r.ref)}</div><div class="s">${r.dirs.map(d => esc(d.to)).join(' ⇄ ')}</div></div></button>`).join('')
    + ps.map(([x, m]) => `<button class="row" data-place="${esc(JSON.stringify(x))}"><span class="rb">${ICON.pin}</span><div class="info"><div class="t">${esc(x[0])}</div><div class="s">${['место', 'улица', 'дом'][x[3]]}</div></div>${me ? `<div class="eta">${fmtD(m)}</div>` : ''}</button>`).join('')
    + ss.map(([s, m]) => `<button class="row" data-stop="${s.i}"><div class="info"><div class="t">${esc(s.n)}</div><div class="chips">${refsAt(s).map(numHtml).join('')}</div></div>${me ? `<div class="eta">${fmtD(m)}</div>` : ''}</button>`).join('')
    || '<div class="row"><div class="info"><div class="s">Ничего не нашлось</div></div></div>';
  el.classList.add('on');
}

function locate(fly) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    me = { la: p.coords.latitude, lo: p.coords.longitude };
    S.last = me; save(); drawMe();
    if (fly) map.setView([me.la, me.lo], 16);
    refresh();
  }, () => { if (fly) toast('Нет доступа к геопозиции'); }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.id === 'grab') { const sh = $('sheet'); sh.classList.remove('big'); sh.classList.toggle('mini'); setTimeout(placeSide, 260); return; }
  if (t.hasAttribute('data-back')) return goBack();
  if (t.hasAttribute('data-home')) { back = []; view = { k: 'home' }; return open(); }
  if (t.id === 'meBtn') return locate(true);
  if (t.id === 'setBtn') return go({ k: 'set' });
  if (t.dataset.fav != null) { const i = +t.dataset.fav, k = S.fav.indexOf(i); if (k < 0) S.fav.push(i); else S.fav.splice(k, 1); save(); t.classList.toggle('on', k < 0); toast(k < 0 ? 'В избранном' : 'Убрано из избранного'); return; }
  if (t.dataset.route != null) {
    $('q').value = ''; $('q').blur();
    const ri = +t.dataset.route, r = D.routes[ri];
    let d = t.dataset.dir != null ? +t.dataset.dir : 0;
    const hi = t.dataset.hi ? +t.dataset.hi : null;
    // Направление не указано — берём то, что проходит ближе ко мне
    if (t.dataset.dir == null && me && r.dirs.length > 1) d = r.dirs.map(x => Math.min(...x.st.slice(0, -1).map(si => dist(me.la, me.lo, D.stops[si].la, D.stops[si].lo)))).reduce((bi, v, i, a) => v < a[bi] ? i : bi, 0);
    const v = { k: 'route', r: ri, d, hi };
    if (t.hasAttribute('data-swap')) { view = v; drawRoute(); drawBuses(); return render(); }
    return go(v);
  }
  if (t.dataset.stop != null) { $('q').value = ''; $('q').blur(); return go({ k: 'stop', s: +t.dataset.stop }); }
  if (t.dataset.place != null) { const x = JSON.parse(t.dataset.place); $('q').value = ''; $('q').blur(); return go({ k: 'trip', to: { n: x[0], la: x[1], lo: x[2] }, opt: 0 }); }
  if (t.dataset.tripstop != null) { const s = D.stops[+t.dataset.tripstop]; return go({ k: 'trip', to: { n: s.n, la: s.la, lo: s.lo }, opt: 0 }); }
  if (t.dataset.opt != null) { view.opt = +t.dataset.opt; drawRoute(); drawBuses(); return render(true); }
  if (t.id === 'liveSave') { S.live = $('liveUrl').value.trim(); save(); fails = 0; $('liveUrl').blur(); toast('Сохранено'); poll(); return; }
  if (t.id === 'bk') { const s = JSON.stringify({ fav: S.fav }); $('bkt').value = s; $('bkt').select(); try { navigator.clipboard.writeText(s); toast('Скопировано'); } catch (er) { toast('Выделено — скопируйте'); } return; }
  if (t.id === 'rs') { try { S.fav = JSON.parse($('bkt').value).fav || []; save(); toast('Восстановлено'); } catch (er) { toast('Не похоже на копию'); } return; }
});
$('q').addEventListener('input', search);
$('q').addEventListener('focus', () => { $('sheet').classList.add('mini'); placeSide(); search(); });
$('q').addEventListener('blur', () => setTimeout(() => { if (!$('q').value) { $('res').classList.remove('on'); $('sheet').classList.remove('mini'); setTimeout(placeSide, 260); } }, 150));
// Свайп по ручке: вверх — шире, вниз — уже
let y0 = null;
$('grab').addEventListener('touchstart', e => y0 = e.touches[0].clientY, { passive: true });
$('grab').addEventListener('touchend', e => {
  if (y0 == null) return;
  const dy = e.changedTouches[0].clientY - y0, sh = $('sheet'); y0 = null;
  if (Math.abs(dy) < 30) return;
  if (dy < 0) { if (sh.classList.contains('mini')) sh.classList.remove('mini'); else sh.classList.add('big'); }
  else { if (sh.classList.contains('big')) sh.classList.remove('big'); else sh.classList.add('mini'); }
  e.preventDefault();
  setTimeout(placeSide, 260);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); locate(); } });

fetch('data.json').then(r => r.json()).then(d => {
  D = d; prepare(); initMap(); render(); setLive(); locate();
  poll(); setInterval(poll, 8000);
  // «Через N мин» и расписание пересчитываются и без новых данных
  setInterval(refresh, 30000);
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
